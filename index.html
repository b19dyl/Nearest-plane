<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071225">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nearest Plane">
<title>Nearest Plane</title>
<style>
:root{
  color-scheme:dark;
  --bg:#02050c;--case:#12264b;--case2:#08101f;--screen:#010204;
  --blue:#59caff;--amber:#ffd455;--white:#f2f8ff;--green:#35e38b;
  --red:#ff7582;--muted:#8294b3;--border:#31538b
}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:radial-gradient(circle at 50% -20%,#244574,transparent 46%),linear-gradient(#07101f,var(--bg));color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}.app{min-height:100svh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;grid-template-rows:auto 1fr auto;gap:13px}
.top,.bottom{width:min(1240px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-weight:900}.icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #3a609d;border-radius:12px;background:#14284c;font-size:22px}
.nav{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.nav button{padding:7px 12px;font-size:.8rem}.active{background:#285893!important;color:#fff!important;border-color:#70a9ef!important}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:850}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
.case{align-self:center;width:min(1240px,100%);margin:auto;padding:clamp(14px,2.3vw,28px);border:1px solid var(--border);border-radius:30px;background:linear-gradient(145deg,var(--case),var(--case2));box-shadow:0 30px 95px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.08)}
.screen{min-height:min(67svh,670px);padding:clamp(22px,4vw,50px);display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-radius:18px;background-color:var(--screen);background-image:radial-gradient(circle,rgba(255,255,255,.14) 1px,transparent 1.25px);background-size:7px 7px;box-shadow:inset 0 0 65px #000,0 0 0 1px rgba(100,155,255,.18);text-transform:uppercase}
.casefoot{padding:12px 8px 0;display:flex;justify-content:space-between;color:#7284a4;font-size:.68rem;font-weight:900;letter-spacing:.2em}
.airline{color:var(--blue);font-size:clamp(1.45rem,5.4vw,4.9rem);font-weight:950;line-height:1.04;letter-spacing:.12em;overflow-wrap:anywhere}.identity{margin-top:clamp(18px,3vw,31px);display:flex;flex-wrap:wrap;gap:.35em 1em;font-size:clamp(1.05rem,3.2vw,2.65rem);font-weight:900;letter-spacing:.1em}.type{color:#d8e9ff}.description{margin-top:12px;color:#8ea3c5;font-weight:800;letter-spacing:.1em}.ids{margin-top:15px;display:flex;gap:18px;flex-wrap:wrap;color:#9eb1cf;font-size:clamp(.7rem,1.2vw,.95rem);font-weight:800;letter-spacing:.07em}
.metrics{margin-top:clamp(24px,3.8vw,42px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(11px,2vw,22px);color:var(--amber);font-size:clamp(.95rem,2.35vw,2.15rem);font-weight:950;letter-spacing:.07em}.metric small,.card small{display:block;margin-bottom:8px;color:var(--muted);font-size:.44em;letter-spacing:.17em}
.message{max-width:760px;margin:auto;text-align:center;color:var(--muted);font-size:clamp(1.05rem,3vw,2rem);line-height:1.5;text-transform:none}.error{color:var(--red)}
button,.link,.airport-select{padding:9px 14px;border:1px solid #35578f;border-radius:999px;background:#101e38;color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.airport-select{max-width:220px}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.bottom{justify-content:center;color:var(--muted);font-size:.85rem}
.title{color:var(--blue);font-size:clamp(1.35rem,3vw,2.5rem);font-weight:950;letter-spacing:.12em;margin-bottom:20px}.list{display:grid;gap:4px}.row{display:grid;grid-template-columns:1fr 1.4fr .8fr .8fr;gap:12px;padding:11px 13px;border-bottom:1px solid #1f3154}.row span{color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:18px;border:1px solid #253b62;border-radius:16px;background:rgba(10,20,39,.75)}.card strong{color:var(--amber);font-size:clamp(1.15rem,2.7vw,2.25rem)}
.radar{position:relative;width:min(68vh,620px);aspect-ratio:1;margin:auto;border:1px solid #285b45;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 24%,rgba(72,255,146,.18) 25%),linear-gradient(90deg,transparent 49.7%,rgba(72,255,146,.22) 50%,transparent 50.3%),linear-gradient(transparent 49.7%,rgba(72,255,146,.22) 50%,transparent 50.3%);box-shadow:inset 0 0 40px rgba(0,255,120,.12)}.home{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.blip{position:absolute;transform:translate(-50%,-50%);color:#7dffad;font-size:18px;filter:drop-shadow(0 0 6px #20ff75)}.blip small{position:absolute;left:50%;transform:translate(-50%,8px);font-size:.55rem;white-space:nowrap}.range{position:absolute;right:4%;bottom:4%;color:#7db68d;font-size:.68rem}
.notice{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;max-width:90%;padding:13px 18px;border:1px solid #496b9f;border-radius:14px;background:#0c1930;color:#d9e8ff;box-shadow:0 12px 40px #000;text-align:center}
dialog{width:min(520px,calc(100% - 30px));padding:24px;border:1px solid #34568f;border-radius:22px;background:#091223;color:#fff}dialog::backdrop{background:rgba(0,0,0,.74)}dialog label{display:grid;gap:8px;margin:17px 0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:900px){.top{flex-wrap:wrap}.nav{order:3;width:100%}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.desktop{display:none}.nav{overflow-x:auto;justify-content:flex-start;flex-wrap:nowrap}.screen{min-height:69svh}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div class="brand"><span class="icon">✈</span><span>Nearest Plane</span></div>
  <nav class="nav">
    <button class="active" data-view="nearest">Nearest</button>
    <button data-view="radar">Radar</button>
    <button data-view="nearby">Nearby</button>
    <button data-view="weather">MAN Weather</button>
    <button data-view="stats">Stats</button>
  </nav>
  <div class="status"><span class="dot"></span><span id="status">Starting…</span></div>
</header>

<section class="case">
  <div class="screen" id="screen"><div class="message">Starting display…</div></div>
  <div class="casefoot"><span>NEARESTPLANE · CLEAN BUILD</span><span id="clock">--:--</span></div>
</section>

<footer class="bottom">
  <span id="updated">Not updated yet</span>
  <div class="buttons">
    <select id="airportSelect" class="airport-select" aria-label="Choose airport"></select>
    <a id="arrivalsLink" class="link desktop" href="#" target="_blank" rel="noopener">Arrivals</a>
    <a id="departuresLink" class="link desktop" href="#" target="_blank" rel="noopener">Departures</a>
    <button id="useLocation">Use My Location</button>
    <button id="useHome">Use Manchester Home</button>
    <button id="auto">Auto: Off</button>
    <button id="refresh">Refresh</button>
    <button id="settings">Settings</button>
  </div>
</footer>
</main>

<dialog id="dialog">
<form method="dialog">
<h2>Display settings</h2>
<label>Search radius <strong><span id="radiusText">60</span> nautical miles</strong><input id="radius" type="range" min="10" max="200" step="5" value="60"></label>
<label>Refresh every <strong><span id="intervalText">30</span> seconds</strong><input id="interval" type="range" min="15" max="120" step="15" value="30"></label>
<div class="actions"><button value="cancel">Cancel</button><button id="save" value="default">Save</button></div>
</form>
</dialog>

<script>
(function(){
"use strict";

var API="https://api.airplanes.live/v2";
var AIRPORTS=[
 {code:"AUTO",name:"Nearest airport (auto)",latitude:null,longitude:null,arrivals:"",departures:""},
 {code:"MAN",name:"Manchester",latitude:53.3537,longitude:-2.27495,arrivals:"https://www.manchesterairport.co.uk/arrivals/",departures:"https://www.manchesterairport.co.uk/departures/"},
 {code:"LPL",name:"Liverpool",latitude:53.3336,longitude:-2.8497,arrivals:"https://www.liverpoolairport.com/flights/arrivals/",departures:"https://www.liverpoolairport.com/flights/departures/"},
 {code:"LBA",name:"Leeds Bradford",latitude:53.8659,longitude:-1.6606,arrivals:"https://www.leedsbradfordairport.co.uk/flights/arrivals",departures:"https://www.leedsbradfordairport.co.uk/flights/departures"},
 {code:"BHX",name:"Birmingham",latitude:52.4539,longitude:-1.7480,arrivals:"https://www.birminghamairport.co.uk/arrivals/",departures:"https://www.birminghamairport.co.uk/departures/"},
 {code:"LHR",name:"London Heathrow",latitude:51.4700,longitude:-0.4543,arrivals:"https://www.heathrow.com/arrivals",departures:"https://www.heathrow.com/departures"},
 {code:"LGW",name:"London Gatwick",latitude:51.1537,longitude:-0.1821,arrivals:"https://www.gatwickairport.com/flights/arrivals/",departures:"https://www.gatwickairport.com/flights/departures/"},
 {code:"STN",name:"London Stansted",latitude:51.8850,longitude:0.2350,arrivals:"https://www.stanstedairport.com/flight-information/arrivals/",departures:"https://www.stanstedairport.com/flight-information/departures/"},
 {code:"LTN",name:"London Luton",latitude:51.8747,longitude:-0.3683,arrivals:"https://www.london-luton.co.uk/flights/arrivals",departures:"https://www.london-luton.co.uk/flights/departures"},
 {code:"EMA",name:"East Midlands",latitude:52.8311,longitude:-1.3281,arrivals:"https://www.eastmidlandsairport.com/flight-information/arrivals/",departures:"https://www.eastmidlandsairport.com/flight-information/departures/"},
 {code:"BRS",name:"Bristol",latitude:51.3827,longitude:-2.7191,arrivals:"https://www.bristolairport.co.uk/arrivals-and-departures/",departures:"https://www.bristolairport.co.uk/arrivals-and-departures/"},
 {code:"NCL",name:"Newcastle",latitude:55.0375,longitude:-1.6917,arrivals:"https://www.newcastleairport.com/flight-information/arrivals/",departures:"https://www.newcastleairport.com/flight-information/departures/"},
 {code:"GLA",name:"Glasgow",latitude:55.8719,longitude:-4.4331,arrivals:"https://www.glasgowairport.com/flight-information/arrivals/",departures:"https://www.glasgowairport.com/flight-information/departures/"},
 {code:"EDI",name:"Edinburgh",latitude:55.9500,longitude:-3.3725,arrivals:"https://www.edinburghairport.com/flights/live-flight-arrivals/",departures:"https://www.edinburghairport.com/flights/live-flight-departures/"}
];
var HOME_FALLBACK={latitude:53.578,longitude:-2.429};
var carriers={
 BAW:"British Airways",EZY:"easyJet",RYR:"Ryanair",RUK:"Ryanair UK",EXS:"Jet2",
 TOM:"TUI Airways",VIR:"Virgin Atlantic",UAE:"Emirates",QTR:"Qatar Airways",
 KLM:"KLM",DLH:"Lufthansa",AFR:"Air France",EIN:"Aer Lingus",WZZ:"Wizz Air",
 LOG:"Loganair",SAS:"SAS",AAL:"American Airlines",UAL:"United Airlines",
 DAL:"Delta Air Lines",SIA:"Singapore Airlines",THY:"Turkish Airlines",
 IBE:"Iberia",TAP:"TAP Air Portugal",SWR:"Swiss",BEL:"Brussels Airlines"
};

function byId(id){return document.getElementById(id)}
var ui={
 screen:byId("screen"),status:byId("status"),updated:byId("updated"),clock:byId("clock"),
 refresh:byId("refresh"),useLocation:byId("useLocation"),useHome:byId("useHome"),
 auto:byId("auto"),settings:byId("settings"),dialog:byId("dialog"),
 radius:byId("radius"),interval:byId("interval"),radiusText:byId("radiusText"),
 intervalText:byId("intervalText"),save:byId("save"),airportSelect:byId("airportSelect"),arrivalsLink:byId("arrivalsLink"),departuresLink:byId("departuresLink")
};

var position=null;
var positionName="";
var planes=[];
var currentView="nearest";
var refreshTimer=null;
var autoTimer=null;
var stats=null;
var selectedAirportCode=localStorage.getItem("npCleanAirport")||"AUTO";
var selectedAirport=null;
var config={
 radius:Number(localStorage.getItem("npCleanRadius"))||60,
 interval:Number(localStorage.getItem("npCleanInterval"))||30
};

function escapeHTML(value){
 return String(value==null?"":value).replace(/[&<>"']/g,function(character){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];
 });
}
function radians(degrees){return degrees*Math.PI/180}
function distanceNm(lat1,lon1,lat2,lon2){
 var radius=3440.065,dLat=radians(lat2-lat1),dLon=radians(lon2-lon1);
 var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(radians(lat1))*Math.cos(radians(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
 return radius*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearing(lat1,lon1,lat2,lon2){
 var y=Math.sin(radians(lon2-lon1))*Math.cos(radians(lat2));
 var x=Math.cos(radians(lat1))*Math.sin(radians(lat2))-Math.sin(radians(lat1))*Math.cos(radians(lat2))*Math.cos(radians(lon2-lon1));
 return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function compass(degrees){
 if(!Number.isFinite(degrees))return "—";
 return ["N","NE","E","SE","S","SW","W","NW"][Math.round(degrees/45)%8];
}
function carrierName(callsign){
 var code=(callsign||"").trim().slice(0,3).toUpperCase();
 return carriers[code]||"Private / General Aviation";
}
function normalise(item){
 var latitude=Number(item.lat),longitude=Number(item.lon);
 if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return null;
 var baro=Number(item.alt_baro),geom=Number(item.alt_geom),speed=Number(item.gs),track=Number(item.track);
 return {
  callsign:(item.flight||item.callsign||"No callsign").trim(),
  registration:item.r||"Unknown",
  hex:(item.hex||"Unknown").toUpperCase(),
  type:item.t||item.type||"Unknown aircraft",
  description:item.desc||"",
  operator:item.ownOp||item.operator||"",
  latitude:latitude,longitude:longitude,
  altitude:Number.isFinite(baro)?baro:(Number.isFinite(geom)?geom:null),
  speed:Number.isFinite(speed)?speed:null,
  track:Number.isFinite(track)?track:null,
  distance:distanceNm(position.latitude,position.longitude,latitude,longitude),
  bearing:bearing(position.latitude,position.longitude,latitude,longitude)
 };
}
function showNotice(text){
 var old=document.querySelector(".notice");if(old)old.remove();
 var node=document.createElement("div");node.className="notice";node.textContent=text;
 document.body.appendChild(node);setTimeout(function(){node.remove()},5000);
}
function renderNearest(){
 var p=planes[0];
 if(!p){ui.screen.innerHTML='<div class="message">No aircraft detected inside the selected radius.</div>';return}
 ui.screen.innerHTML=
 '<div class="airline">'+escapeHTML(p.operator||carrierName(p.callsign))+'</div>'+
 '<div class="identity"><span>'+escapeHTML(p.callsign)+'</span><span class="type">'+escapeHTML(p.type)+'</span></div>'+
 (p.description?'<div class="description">'+escapeHTML(p.description)+'</div>':'')+
 '<div class="ids"><span>REG: '+escapeHTML(p.registration)+'</span><span>ICAO: '+escapeHTML(p.hex)+'</span><span>SOURCE: '+escapeHTML(positionName)+'</span></div>'+
 '<div class="metrics">'+
 '<div class="metric"><small>Altitude</small>'+(p.altitude===null?'—':Math.round(p.altitude).toLocaleString("en-GB")+' FT')+'</div>'+
 '<div class="metric"><small>Speed</small>'+(p.speed===null?'—':Math.round(p.speed*1.15078)+' MPH')+'</div>'+
 '<div class="metric"><small>Distance</small>'+(p.distance*1.15078).toFixed(1)+' MI</div>'+
 '<div class="metric"><small>Heading</small>'+(p.track===null?'—':Math.round(p.track)+'° '+compass(p.track))+'</div></div>';
}
function renderNearby(){
 var rows=planes.slice(0,9).map(function(p){
  return '<div class="row"><strong>'+escapeHTML(p.callsign)+'</strong><span>'+escapeHTML(p.operator||carrierName(p.callsign))+'</span><span>'+(p.distance*1.15078).toFixed(1)+' mi</span><span>'+(p.altitude?Math.round(p.altitude).toLocaleString("en-GB")+' ft':'—')+'</span></div>';
 }).join("");
 ui.screen.innerHTML='<div class="title">NEARBY AIRCRAFT</div><div class="list">'+(rows||'<div class="message">No aircraft detected.</div>')+'</div>';
}
function renderRadar(){
 var blips=planes.slice(0,25).map(function(p){
  var ratio=Math.min(p.distance/config.radius,1)*44,angle=radians(p.bearing);
  var x=50+Math.sin(angle)*ratio,y=50-Math.cos(angle)*ratio;
  return '<span class="blip" style="left:'+x+'%;top:'+y+'%">✈<small>'+escapeHTML(p.callsign)+'</small></span>';
 }).join("");
 ui.screen.innerHTML='<div class="radar"><span class="home">⌂</span>'+blips+'<span class="range">'+config.radius+' NM</span></div>';
}
function loadStats(){
 var today=new Date().toISOString().slice(0,10);
 try{stats=JSON.parse(localStorage.getItem("npCleanStats")||"null")}catch(error){stats=null}
 if(!stats||stats.date!==today)stats={date:today,seen:{},closest:null,highest:0,fastest:0};
}
function updateStats(){
 planes.forEach(function(p){
  stats.seen[p.hex]=1;
  if(stats.closest===null||p.distance<stats.closest)stats.closest=p.distance;
  if(p.altitude&&p.altitude>stats.highest)stats.highest=p.altitude;
  if(p.speed&&p.speed>stats.fastest)stats.fastest=p.speed;
 });
 localStorage.setItem("npCleanStats",JSON.stringify(stats));
}
function renderStats(){
 ui.screen.innerHTML='<div class="title">TODAY\'S AIRCRAFT</div><div class="grid">'+
 '<div class="card"><small>Unique aircraft</small><strong>'+Object.keys(stats.seen).length+'</strong></div>'+
 '<div class="card"><small>Closest</small><strong>'+(stats.closest===null?'—':(stats.closest*1.15078).toFixed(1)+' MI')+'</strong></div>'+
 '<div class="card"><small>Highest</small><strong>'+(stats.highest?Math.round(stats.highest).toLocaleString("en-GB")+' FT':'—')+'</strong></div>'+
 '<div class="card"><small>Fastest</small><strong>'+(stats.fastest?Math.round(stats.fastest*1.15078)+' MPH':'—')+'</strong></div></div>';
}

function findNearestAirport(coords){
 var candidates=AIRPORTS.filter(function(a){return a.code!=="AUTO"});
 var nearest=candidates[0],best=Infinity;
 candidates.forEach(function(airport){
  var d=distanceNm(coords.latitude,coords.longitude,airport.latitude,airport.longitude);
  if(d<best){best=d;nearest=airport}
 });
 return nearest;
}
function getSelectedAirport(){
 if(selectedAirportCode==="AUTO"){
  return findNearestAirport(position||HOME_FALLBACK);
 }
 return AIRPORTS.find(function(a){return a.code===selectedAirportCode})||AIRPORTS[1];
}
function updateAirportControls(){
 selectedAirport=getSelectedAirport();
 ui.arrivalsLink.href=selectedAirport.arrivals;
 ui.departuresLink.href=selectedAirport.departures;
 ui.arrivalsLink.textContent=selectedAirport.code+" Arrivals";
 ui.departuresLink.textContent=selectedAirport.code+" Departures";
}
function populateAirports(){
 ui.airportSelect.innerHTML=AIRPORTS.map(function(a){
  return '<option value="'+a.code+'">'+escapeHTML(a.name)+(a.code==="AUTO"?"":" ("+a.code+")")+'</option>';
 }).join("");
 ui.airportSelect.value=selectedAirportCode;
 updateAirportControls();
}
function renderWeather(){
 ui.screen.innerHTML='<div class="message">Loading Manchester Airport weather…</div>';
 selectedAirport=getSelectedAirport();
 var url='https://api.open-meteo.com/v1/forecast?latitude='+selectedAirport.latitude+'&longitude='+selectedAirport.longitude+'&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,visibility,cloud_cover&wind_speed_unit=mph&timezone=Europe%2FLondon';
 fetch(url,{cache:"no-store"}).then(function(response){
  if(!response.ok)throw new Error("Weather "+response.status);return response.json();
 }).then(function(data){
  var c=data.current;
  ui.screen.innerHTML='<div class="title">'+escapeHTML(selectedAirport.name.toUpperCase())+' AIRPORT · '+escapeHTML(selectedAirport.code)+'</div><div class="grid">'+
  '<div class="card"><small>Temperature</small><strong>'+Math.round(c.temperature_2m)+'°C</strong></div>'+
  '<div class="card"><small>Feels like</small><strong>'+Math.round(c.apparent_temperature)+'°C</strong></div>'+
  '<div class="card"><small>Wind</small><strong>'+Math.round(c.wind_speed_10m)+' MPH</strong></div>'+
  '<div class="card"><small>Direction</small><strong>'+Math.round(c.wind_direction_10m)+'° '+compass(c.wind_direction_10m)+'</strong></div>'+
  '<div class="card"><small>Visibility</small><strong>'+(c.visibility/1609.344).toFixed(1)+' MI</strong></div>'+
  '<div class="card"><small>Cloud</small><strong>'+Math.round(c.cloud_cover)+'%</strong></div></div>';
 }).catch(function(){ui.screen.innerHTML='<div class="message error">Airport weather could not be loaded.</div>'});
}
function render(){
 if(currentView==="nearest")renderNearest();
 else if(currentView==="radar")renderRadar();
 else if(currentView==="nearby")renderNearby();
 else if(currentView==="weather")renderWeather();
 else renderStats();
}
function fetchAircraft(){
 if(!position)return;
 ui.status.textContent="Updating…";
 var url=API+"/point/"+position.latitude+"/"+position.longitude+"/"+config.radius;
 fetch(url,{cache:"no-store"}).then(function(response){
  if(!response.ok)throw new Error("Aircraft "+response.status);return response.json();
 }).then(function(data){
  var list=Array.isArray(data.ac)?data.ac:(Array.isArray(data.aircraft)?data.aircraft:[]);
  planes=list.map(normalise).filter(Boolean).sort(function(a,b){return a.distance-b.distance});
  updateStats();render();
  ui.status.textContent="Live";
  ui.updated.textContent="Updated "+new Date().toLocaleTimeString("en-GB")+" · "+positionName;
 }).catch(function(error){
  console.error(error);ui.status.textContent="Offline";
  ui.screen.innerHTML='<div class="message error">Live aircraft data could not be reached. Tap Refresh to retry.</div>';
 });
}
function beginAt(coords,name){
 position={latitude:Number(coords.latitude),longitude:Number(coords.longitude)};
 positionName=name;updateAirportControls();fetchAircraft();
 clearInterval(refreshTimer);refreshTimer=setInterval(fetchAircraft,config.interval*1000);
}
function useManchesterHome(reason){
 beginAt(HOME_FALLBACK,"Manchester home");
 if(reason)showNotice(reason+" Using the Manchester home fallback.");
}
function requestLocation(){
 ui.status.textContent="Finding location…";
 ui.screen.innerHTML='<div class="message">Asking this device for its location…</div>';
 if(!navigator.geolocation){useManchesterHome("This browser does not support location.");return}
 var completed=false;
 var fallback=setTimeout(function(){
  if(!completed){completed=true;useManchesterHome("The device did not return a location promptly.");}
 },8000);
 navigator.geolocation.getCurrentPosition(function(result){
  if(completed)return;completed=true;clearTimeout(fallback);beginAt(result.coords,"Device location");
 },function(){
  if(completed)return;completed=true;clearTimeout(fallback);useManchesterHome("Location was unavailable or blocked.");
 },{enableHighAccuracy:true,timeout:7000,maximumAge:300000});
}

document.querySelectorAll(".nav button").forEach(function(button){
 button.addEventListener("click",function(){
  document.querySelectorAll(".nav button").forEach(function(item){item.classList.remove("active")});
  button.classList.add("active");currentView=button.dataset.view;render();
 });
});
ui.airportSelect.addEventListener("change",function(){
 selectedAirportCode=ui.airportSelect.value;
 localStorage.setItem("npCleanAirport",selectedAirportCode);
 updateAirportControls();
 if(currentView==="weather")renderWeather();
});
ui.refresh.addEventListener("click",fetchAircraft);
ui.useLocation.addEventListener("click",requestLocation);
ui.useHome.addEventListener("click",function(){useManchesterHome("Switched location.")});
ui.auto.addEventListener("click",function(){
 if(autoTimer){clearInterval(autoTimer);autoTimer=null;ui.auto.textContent="Auto: Off";return}
 var views=["nearest","radar","nearby","weather","stats"],index=views.indexOf(currentView);
 autoTimer=setInterval(function(){
  index=(index+1)%views.length;currentView=views[index];
  document.querySelectorAll(".nav button").forEach(function(item){item.classList.toggle("active",item.dataset.view===currentView)});
  render();
 },15000);ui.auto.textContent="Auto: On";
});
ui.settings.addEventListener("click",function(){
 ui.radius.value=config.radius;ui.interval.value=config.interval;
 ui.radiusText.textContent=config.radius;ui.intervalText.textContent=config.interval;ui.dialog.showModal();
});
ui.radius.addEventListener("input",function(){ui.radiusText.textContent=ui.radius.value});
ui.interval.addEventListener("input",function(){ui.intervalText.textContent=ui.interval.value});
ui.save.addEventListener("click",function(event){
 event.preventDefault();config.radius=Number(ui.radius.value);config.interval=Number(ui.interval.value);
 localStorage.setItem("npCleanRadius",config.radius);localStorage.setItem("npCleanInterval",config.interval);
 ui.dialog.close();fetchAircraft();clearInterval(refreshTimer);refreshTimer=setInterval(fetchAircraft,config.interval*1000);
});
setInterval(function(){ui.clock.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})},1000);

loadStats();
populateAirports();
ui.radiusText.textContent=config.radius;ui.intervalText.textContent=config.interval;
requestLocation();
})();
</script>
</body>
</html>
