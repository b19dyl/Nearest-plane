<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#040812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nearest Plane">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Nearest Plane</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-icon">✈</span><span>Nearest Plane</span></div>
    <nav class="tabs" aria-label="Display screens">
      <button class="tab active" data-view="nearest">Nearest</button>
      <button class="tab" data-view="radar">Radar</button>
      <button class="tab" data-view="nearby">Nearby</button>
      <button class="tab" data-view="weather">MAN Weather</button>
      <button class="tab" data-view="stats">Stats</button>
    </nav>
    <div class="live-status"><span class="live-dot"></span><span id="statusText">Starting…</span></div>
  </header>

  <section class="unit">
    <div class="display" id="display">
      <div class="message">Allow location access to find nearby aircraft.</div>
    </div>
    <div class="unit-footer"><span>NEARESTPLANE</span><span id="clock">--:--</span></div>
  </section>

  <footer class="controls">
    <span id="updatedText">Waiting for location</span>
    <div>
      <a class="button-link" href="https://www.manchesterairport.co.uk/arrivals/" target="_blank" rel="noopener">MAN Arrivals</a>
      <a class="button-link" href="https://www.manchesterairport.co.uk/departures/" target="_blank" rel="noopener">MAN Departures</a>
      <button id="refreshButton">Refresh</button>
      <button id="settingsButton">Settings</button>
    </div>
  </footer>
</main>

<dialog id="settingsDialog">
  <form method="dialog">
    <h2>Display settings</h2>
    <label>Search radius
      <strong><span id="radiusValue">75</span> nautical miles</strong>
      <input id="radiusInput" type="range" min="10" max="200" step="5" value="75">
    </label>
    <label>Refresh every
      <strong><span id="refreshValue">30</span> seconds</strong>
      <input id="refreshInput" type="range" min="15" max="120" step="15" value="30">
    </label>
    <label>Theme<select id="themeInput"><option value="airport">Airport blue</option><option value="amber">Classic amber</option><option value="green">Radar green</option></select></label><div class="dialog-actions">
      <button value="cancel">Cancel</button>
      <button id="saveSettings" value="default">Save</button>
    </div>
  </form>
</dialog>
<script src="script.js"></script>
</body>
</html>
