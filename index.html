<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nearest Plane V4</title>
<style>
:root{color-scheme:dark;--bg:#03060e;--panel:#14284e;--panel2:#091120;--screen:#010204;--accent:#57c9ff;--value:#ffd45a;--text:#eff8ff;--muted:#8192af;--green:#36e38d;--red:#ff7d87;--border:#2d4b82}
:root[data-theme=amber]{--accent:#ffd45a;--value:#fff0a0;--panel:#2a210b;--border:#6f5b20}
:root[data-theme=green]{--accent:#57ef91;--value:#8affad;--panel:#0b2a1a;--border:#226f44}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%}
body{overflow:hidden;background:radial-gradient(circle at 50% -20%,#244475 0,transparent 45%),linear-gradient(180deg,#07101f,var(--bg));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}.app{min-height:100svh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;grid-template-rows:auto 1fr auto;gap:13px}
.topbar,.controls{width:min(1250px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.brand-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #365b98;border-radius:12px;background:#142649;font-size:22px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.tab{padding:7px 11px;font-size:.78rem;background:#0b1730;color:#90a3c4}.tab.active{background:#244b87;color:#fff;border-color:#5e91db}.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
.unit{align-self:center;width:min(1250px,100%);margin:auto;padding:clamp(14px,2.3vw,28px);border:1px solid var(--border);border-radius:30px;background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:0 30px 95px rgba(0,0,0,.58),inset 0 1px rgba(255,255,255,.08)}
.display{min-height:min(67svh,680px);padding:clamp(22px,4vw,52px);display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-radius:18px;background-color:var(--screen);background-image:radial-gradient(circle,rgba(255,255,255,.14) 1px,transparent 1.25px);background-size:7px 7px;box-shadow:inset 0 0 65px #000,0 0 0 1px rgba(110,160,255,.17);text-transform:uppercase}
.unit-footer{padding:12px 8px 0;display:flex;justify-content:space-between;color:#7182a3;font-size:.68rem;font-weight:900;letter-spacing:.2em}
.airline{color:var(--accent);font-size:clamp(1.45rem,5.3vw,4.8rem);font-weight:950;line-height:1.05;letter-spacing:.12em;overflow-wrap:anywhere}.identity{margin-top:clamp(18px,3vw,32px);display:flex;flex-wrap:wrap;gap:.35em 1em;font-size:clamp(1.05rem,3.2vw,2.6rem);font-weight:900;letter-spacing:.1em}.type{color:#d5e7ff}.operator{margin-top:12px;color:#8fa3c6;font-size:clamp(.78rem,1.5vw,1.05rem);font-weight:800;letter-spacing:.11em}.ids{margin-top:15px;display:flex;gap:18px;flex-wrap:wrap;color:#9eb0cc;font-size:clamp(.7rem,1.15vw,.92rem);font-weight:800;letter-spacing:.07em}
.metrics{margin-top:clamp(24px,3.8vw,42px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(11px,2vw,22px);color:var(--value);font-size:clamp(.95rem,2.35vw,2.15rem);font-weight:950;letter-spacing:.07em}.metric small,.card small{display:block;margin-bottom:8px;color:var(--muted);font-size:.44em;letter-spacing:.17em}.message{max-width:760px;margin:auto;color:var(--muted);text-align:center;font-size:clamp(1.05rem,3vw,2rem);line-height:1.5;text-transform:none}.error{color:var(--red)}
.controls{justify-content:center;color:var(--muted);font-size:.84rem}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button,.link{padding:9px 14px;border:1px solid #34558d;border-radius:999px;background:#101d36;color:#fff;font-weight:850;text-decoration:none;cursor:pointer}
.title{color:var(--accent);font-size:clamp(1.35rem,3vw,2.5rem);font-weight:950;letter-spacing:.12em;margin-bottom:20px}.list{display:grid;gap:5px;width:100%}.row{display:grid;grid-template-columns:1fr 1.4fr .8fr .8fr;gap:12px;padding:11px 13px;border-bottom:1px solid #1f3154}.row span{color:var(--value)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%}.card{padding:18px;border:1px solid #24395f;border-radius:16px;background:rgba(10,20,39,.72)}.card strong{color:var(--value);font-size:clamp(1.15rem,2.7vw,2.25rem)}
.radar{position:relative;width:min(68vh,620px);aspect-ratio:1;margin:auto;border:1px solid #285b45;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 24%,rgba(72,255,146,.18) 25%),linear-gradient(90deg,transparent 49.7%,rgba(72,255,146,.22) 50%,transparent 50.3%),linear-gradient(transparent 49.7%,rgba(72,255,146,.22) 50%,transparent 50.3%);box-shadow:inset 0 0 40px rgba(0,255,120,.12)}.home{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.blip{position:absolute;transform:translate(-50%,-50%);color:#7dffad;font-size:18px;filter:drop-shadow(0 0 6px #20ff75)}.blip small{position:absolute;left:50%;transform:translate(-50%,8px);font-size:.55rem;white-space:nowrap}.range{position:absolute;right:4%;bottom:4%;color:#7db68d;font-size:.68rem}
.alert{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(150,10,0,.9);text-align:center}.alert strong{font-size:clamp(2rem,8vw,6rem)}.alert small{display:block;font-size:clamp(1rem,3vw,2rem)}
dialog{width:min(520px,calc(100% - 30px));padding:24px;border:1px solid #34568f;border-radius:22px;background:#091223;color:#fff}dialog::backdrop{background:rgba(0,0,0,.74)}dialog label{display:grid;gap:8px;margin:17px 0}.switch{grid-template-columns:1fr auto;align-items:center}.switch input{width:auto}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:900px){.topbar{flex-wrap:wrap}.tabs{order:3;width:100%}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.desktop{display:none}.tabs{overflow-x:auto;justify-content:flex-start;flex-wrap:nowrap}.display{min-height:69svh}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-icon">✈</span><span>Nearest Plane</span></div>
<nav class="tabs"><button class="tab active" data-view="nearest">Nearest</button><button class="tab" data-view="radar">Radar</button><button class="tab" data-view="nearby">Nearby</button><button class="tab" data-view="weather">MAN Weather</button><button class="tab" data-view="stats">Stats</button></nav>
<div class="live"><span class="dot"></span><span id="status">Starting…</span></div></header>
<section class="unit"><div class="display" id="display"><div class="message">Starting location service…</div></div><div class="unit-footer"><span>NEARESTPLANE V4</span><span id="clock">--:--</span></div></section>
<footer class="controls"><span id="updated">Waiting for location</span><div class="buttons"><a class="link desktop" href="https://www.manchesterairport.co.uk/arrivals/" target="_blank">MAN Arrivals</a><a class="link desktop" href="https://www.manchesterairport.co.uk/departures/" target="_blank">MAN Departures</a><button id="auto">Auto: Off</button><button id="refresh">Refresh</button><button id="settings">Settings</button></div></footer>
</main>
<dialog id="dialog"><form method="dialog"><h2>Settings</h2>
<label>Search radius <strong><span id="radiusText">75</span> nautical miles</strong><input id="radius" type="range" min="10" max="200" step="5" value="75"></label>
<label>Refresh every <strong><span id="intervalText">30</span> seconds</strong><input id="interval" type="range" min="15" max="120" step="15" value="30"></label>
<label>Close alert <strong><span id="alertText">2</span> miles</strong><input id="alertDistance" type="range" min=".5" max="10" step=".5" value="2"></label>
<label class="switch"><span>Sound alert</span><input id="sound" type="checkbox"></label>
<label>Theme<select id="theme"><option value="airport">Airport blue</option><option value="amber">Classic amber</option><option value="green">Radar green</option></select></label>
<div class="actions"><button value="cancel">Cancel</button><button id="save" value="default">Save</button></div></form></dialog>
<script>
(function(){
"use strict";
const API="https://api.airplanes.live/v2", MAN={lat:53.3537,lon:-2.27495};
const carriers={BAW:"British Airways",EZY:"easyJet",RYR:"Ryanair",RUK:"Ryanair UK",EXS:"Jet2",TOM:"TUI Airways",VIR:"Virgin Atlantic",UAE:"Emirates",QTR:"Qatar Airways",KLM:"KLM",DLH:"Lufthansa",AFR:"Air France",EIN:"Aer Lingus",WZZ:"Wizz Air",LOG:"Loganair",SAS:"SAS",AAL:"American Airlines",UAL:"United Airlines",DAL:"Delta Air Lines",SIA:"Singapore Airlines",THY:"Turkish Airlines",IBE:"Iberia",TAP:"TAP Air Portugal",SWR:"Swiss",BEL:"Brussels Airlines"};
const $=id=>document.getElementById(id),ui={display:$("display"),status:$("status"),updated:$("updated"),clock:$("clock"),refresh:$("refresh"),auto:$("auto"),settings:$("settings"),dialog:$("dialog"),radius:$("radius"),interval:$("interval"),alert:$("alertDistance"),sound:$("sound"),theme:$("theme"),radiusText:$("radiusText"),intervalText:$("intervalText"),alertText:$("alertText"),save:$("save")};
let loc=null,planes=[],view="nearest",timer=null,autoTimer=null,lastAlert="",stats=JSON.parse(localStorage.getItem("np4stats")||'null');
let cfg={radius:+localStorage.getItem("np4radius")||75,interval:+localStorage.getItem("np4interval")||30,alert:+localStorage.getItem("np4alert")||2,sound:localStorage.getItem("np4sound")==="1",theme:localStorage.getItem("np4theme")||"airport"};
document.documentElement.dataset.theme=cfg.theme;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);
function dist(a,b,c,d){const r=x=>x*Math.PI/180,R=3440.065,dl=r(c-a),dn=r(d-b),q=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function bearing(a,b,c,d){const r=x=>x*Math.PI/180,y=Math.sin(r(d-b))*Math.cos(r(c)),x=Math.cos(r(a))*Math.sin(r(c))-Math.sin(r(a))*Math.cos(r(c))*Math.cos(r(d-b));return(Math.atan2(y,x)*180/Math.PI+360)%360}
function compass(d){return Number.isFinite(d)?["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8]:"—"}
function carrier(c){return carriers[(c||"").slice(0,3).toUpperCase()]||"Private / General Aviation"}
function normalise(a){const lat=+a.lat,lon=+a.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;const ab=+a.alt_baro,ag=+a.alt_geom,gs=+a.gs,tr=+a.track;return{call:(a.flight||a.callsign||"No callsign").trim(),reg:a.r||"Unknown",hex:(a.hex||"Unknown").toUpperCase(),type:a.t||a.type||"Unknown aircraft",desc:a.desc||"",operator:a.ownOp||a.operator||"",lat,lon,alt:Number.isFinite(ab)?ab:Number.isFinite(ag)?ag:null,speed:Number.isFinite(gs)?gs:null,track:Number.isFinite(tr)?tr:null,distance:dist(loc.latitude,loc.longitude,lat,lon),bearing:bearing(loc.latitude,loc.longitude,lat,lon)}}
function nearest(){const p=planes[0];if(!p)return'<div class="message">No aircraft detected nearby. I’ll keep checking.</div>';return`<div class="airline">${esc(p.operator||carrier(p.call))}</div><div class="identity"><span>${esc(p.call)}</span><span class="type">${esc(p.type)}</span></div>${p.desc?`<div class="operator">${esc(p.desc)}</div>`:""}<div class="ids"><span>REG: ${esc(p.reg)}</span><span>ICAO: ${esc(p.hex)}</span><span>CARRIER: ${esc((p.call||"---").slice(0,3))}</span></div><div class="metrics"><div class="metric"><small>Altitude</small>${p.alt===null?"—":Math.round(p.alt).toLocaleString("en-GB")+" FT"}</div><div class="metric"><small>Speed</small>${p.speed===null?"—":Math.round(p.speed*1.15078)+" MPH"}</div><div class="metric"><small>Distance</small>${(p.distance*1.15078).toFixed(1)} MI</div><div class="metric"><small>Heading</small>${p.track===null?"—":Math.round(p.track)+"° "+compass(p.track)}</div></div>`}
function nearby(){return`<div class="title">NEARBY AIRCRAFT</div><div class="list">${planes.slice(0,9).map(p=>`<div class="row"><strong>${esc(p.call)}</strong><span>${esc(p.operator||carrier(p.call))}</span><span>${(p.distance*1.15078).toFixed(1)} mi</span><span>${p.alt?Math.round(p.alt).toLocaleString("en-GB")+" ft":"—"}</span></div>`).join("")||'<div class="message">No aircraft detected.</div>'}</div>`}
function radar(){const blips=planes.slice(0,25).map(p=>{const rr=Math.min(p.distance/cfg.radius,1)*44,rad=p.bearing*Math.PI/180,x=50+Math.sin(rad)*rr,y=50-Math.cos(rad)*rr;return`<span class="blip" style="left:${x}%;top:${y}%">✈<small>${esc(p.call)}</small></span>`}).join("");return`<div class="radar"><span class="home">⌂</span>${blips}<span class="range">${cfg.radius} NM</span></div>`}
async function weather(){ui.display.innerHTML='<div class="message">Loading Manchester Airport weather…</div>';try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${MAN.lat}&longitude=${MAN.lon}&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,visibility,cloud_cover&wind_speed_unit=mph&timezone=Europe%2FLondon`,{cache:"no-store"});if(!r.ok)throw Error();const c=(await r.json()).current;ui.display.innerHTML=`<div class="title">MANCHESTER AIRPORT · EGCC</div><div class="grid"><div class="card"><small>Temperature</small><strong>${Math.round(c.temperature_2m)}°C</strong></div><div class="card"><small>Feels like</small><strong>${Math.round(c.apparent_temperature)}°C</strong></div><div class="card"><small>Wind</small><strong>${Math.round(c.wind_speed_10m)} MPH</strong></div><div class="card"><small>Direction</small><strong>${Math.round(c.wind_direction_10m)}° ${compass(c.wind_direction_10m)}</strong></div><div class="card"><small>Visibility</small><strong>${(c.visibility/1609.344).toFixed(1)} MI</strong></div><div class="card"><small>Cloud</small><strong>${Math.round(c.cloud_cover)}%</strong></div></div>`}catch(e){ui.display.innerHTML='<div class="message error">Manchester weather could not be loaded.</div>'}}
function statHTML(){return`<div class="title">TODAY'S AIRCRAFT</div><div class="grid"><div class="card"><small>Unique aircraft</small><strong>${Object.keys(stats.seen).length}</strong></div><div class="card"><small>Closest</small><strong>${stats.closest===null?"—":(stats.closest*1.15078).toFixed(1)+" MI"}</strong></div><div class="card"><small>Highest</small><strong>${stats.highest?Math.round(stats.highest).toLocaleString("en-GB")+" FT":"—"}</strong></div><div class="card"><small>Fastest</small><strong>${stats.fastest?Math.round(stats.fastest*1.15078)+" MPH":"—"}</strong></div></div>`}
function render(){if(view==="nearest")ui.display.innerHTML=nearest();else if(view==="radar")ui.display.innerHTML=radar();else if(view==="nearby")ui.display.innerHTML=nearby();else if(view==="weather")weather();else ui.display.innerHTML=statHTML()}
function updateStats(){const day=new Date().toISOString().slice(0,10);if(!stats||stats.day!==day)stats={day,seen:{},closest:null,highest:0,fastest:0};planes.forEach(p=>{stats.seen[p.hex]=1;if(stats.closest===null||p.distance<stats.closest)stats.closest=p.distance;if(p.alt&&p.alt>stats.highest)stats.highest=p.alt;if(p.speed&&p.speed>stats.fastest)stats.fastest=p.speed});localStorage.setItem("np4stats",JSON.stringify(stats))}
function alertCheck(){const p=planes[0];if(!p||p.distance*1.15078>cfg.alert||p.hex===lastAlert)return;lastAlert=p.hex;const a=document.createElement("div");a.className="alert";a.innerHTML=`<div><strong>LOOK UP!</strong><small>${esc(p.call)} · ${(p.distance*1.15078).toFixed(1)} miles</small></div>`;a.onclick=()=>a.remove();document.body.appendChild(a);setTimeout(()=>a.remove(),6000)}
async function load(){if(!loc)return locate();ui.status.textContent="Updating…";try{const r=await fetch(`${API}/point/${loc.latitude}/${loc.longitude}/${cfg.radius}`,{cache:"no-store"});if(!r.ok)throw Error(r.status);const d=await r.json(),list=Array.isArray(d.ac)?d.ac:(Array.isArray(d.aircraft)?d.aircraft:[]);planes=list.map(normalise).filter(Boolean).sort((a,b)=>a.distance-b.distance);updateStats();render();alertCheck();ui.updated.textContent="Updated "+new Date().toLocaleTimeString("en-GB");ui.status.textContent="Live"}catch(e){ui.display.innerHTML='<div class="message error">Live aircraft data could not be reached. Tap Refresh.</div>';ui.status.textContent="Offline"}}
function locate(){ui.status.textContent="Finding location…";if(!navigator.geolocation){ui.display.innerHTML='<div class="message error">Location is unavailable in this browser.</div>';return}navigator.geolocation.getCurrentPosition(p=>{loc=p.coords;load();clearInterval(timer);timer=setInterval(load,cfg.interval*1000)},e=>{ui.display.innerHTML='<div class="message error">Location access was blocked. Allow location for this website, then refresh.</div>';ui.status.textContent="Location blocked"},{enableHighAccuracy:true,timeout:15000,maximumAge:300000})}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()});
ui.refresh.onclick=()=>load();ui.auto.onclick=()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;ui.auto.textContent="Auto: Off"}else{const v=["nearest","radar","nearby","weather","stats"];let i=v.indexOf(view);autoTimer=setInterval(()=>{i=(i+1)%v.length;view=v[i];document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.view===view));render()},15000);ui.auto.textContent="Auto: On"}};
ui.settings.onclick=()=>{ui.radius.value=cfg.radius;ui.interval.value=cfg.interval;ui.alert.value=cfg.alert;ui.sound.checked=cfg.sound;ui.theme.value=cfg.theme;ui.radiusText.textContent=cfg.radius;ui.intervalText.textContent=cfg.interval;ui.alertText.textContent=cfg.alert;ui.dialog.showModal()};
ui.radius.oninput=()=>ui.radiusText.textContent=ui.radius.value;ui.interval.oninput=()=>ui.intervalText.textContent=ui.interval.value;ui.alert.oninput=()=>ui.alertText.textContent=ui.alert.value;
ui.save.onclick=e=>{e.preventDefault();cfg={radius:+ui.radius.value,interval:+ui.interval.value,alert:+ui.alert.value,sound:ui.sound.checked,theme:ui.theme.value};localStorage.setItem("np4radius",cfg.radius);localStorage.setItem("np4interval",cfg.interval);localStorage.setItem("np4alert",cfg.alert);localStorage.setItem("np4sound",cfg.sound?"1":"0");localStorage.setItem("np4theme",cfg.theme);document.documentElement.dataset.theme=cfg.theme;ui.dialog.close();load()};
setInterval(()=>ui.clock.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),1000);
locate();
})();
</script>
</body></html>
